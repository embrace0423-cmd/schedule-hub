<!doctype html>
<html lang="ko">
<head>

  <meta name="mobile-web-app-capable" content="yes">

<body>
  <div id="app" aria-busy="true">
    <aside class="sidebar" aria-label="사이드바">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>스케줄 허브</span></div>
      <button class="btn primary" data-action="new-any" style="width:100%;min-height:42px">

      <nav class="nav" aria-label="메뉴"></nav>
      <div class="side-sec mini" id="mini"></div>
      <div class="side-sec"><h4>영역</h4><div class="arealist" id="area-list"></div></div>
      <div class="side-foot" id="side-status"></div>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="page-title">스케줄 허브</h1>
        <span class="grow"></span>
        <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="top-search" type="search" placeholder="검색 ( / )" aria-label="검색"></label>
        <button class="btn ghost icon mobile-only" data-action="search-mobile" aria-label="검색" id="search-m">

      <div id="banner" role="status"></div>
      <section id="view" aria-live="polite">
        <div class="empty" style="padding:60px 0">불러오는 중…</div>
      </section>
    </main>
    <nav class="tabbar" aria-label="하단 메뉴"></nav>
    <button class="fab" id="fab" data-action="fab" aria-label="새로 만들기">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <div id="modal-root"></div>
