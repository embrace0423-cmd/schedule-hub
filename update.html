<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>스케줄 허브 · 앱 업데이트</title>
  <style>
    body { font: 16px/1.7 system-ui,sans-serif; max-width: 560px; margin: 48px auto; padding: 0 24px; }
    button, a { font: inherit; } button { padding: 12px 20px; cursor: pointer; }
    #status { white-space: pre-wrap; } small { display: block; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>스케줄 허브 업데이트</h1>
  <p>월 보기: <strong>← 이전 달 · 다음 달 →</strong></p>
  <p>일정·할 일·로그인 정보는 삭제하지 않고 앱 화면 파일만 갱신합니다.</p>
  <small>편집 중인 내용은 먼저 저장하고, 열려 있는 스케줄 허브 앱 창을 닫은 뒤 진행하세요.</small>
  <button id="update" type="button">최신 앱 적용</button>
  <p id="status" role="status" aria-live="polite">인터넷 연결이 필요합니다.</p>
  <p><a id="back" href="./#/calendar?v=month">캘린더로 돌아가기</a></p>
  <script type="module">
    const base = new URL('./', location.href);
    const button = document.getElementById('update');
    const status = document.getElementById('status');
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));
    function versionOf(worker) {
      if (!worker) return Promise.resolve(null);
      return new Promise((resolve) => {
        const channel = new MessageChannel();
        let timer;
        const finish = (value) => { clearTimeout(timer); channel.port1.close(); resolve(value); };
        timer = setTimeout(() => finish(null), 600);
        channel.port1.onmessage = (event) => finish(event.data?.version || null);
        try { worker.postMessage({ type: 'SH_GET_VERSION' }, [channel.port2]); }
        catch { finish(null); }
      });
    }
    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = '최신 앱 파일을 확인하고 있습니다…';
      try {
        const response = await fetch(new URL('sw.js?check=' + Date.now(), base), { cache: 'no-store' });
        if (!response.ok) throw new Error('최신 버전 확인 실패');
        const text = await response.text();
        const expected = text.match(/const VERSION\s*=\s*['"](sh-v[\d.]+)['"]/)?.[1];
        if (!expected) throw new Error('버전 정보를 확인하지 못했습니다.');
        if (!('serviceWorker' in navigator)) throw new Error('이 브라우저에서는 앱 업데이트를 지원하지 않습니다. Chrome으로 여세요.');
        const reg = await navigator.serviceWorker.register(new URL('sw.js', base), { scope: base.href, updateViaCache: 'none' });
        await reg.update();
        let activeVersion = null;
        const deadline = Date.now() + 30000;
        while (Date.now() < deadline) {
          reg.waiting?.postMessage({ type: 'SH_SKIP_WAITING' });
          activeVersion = await versionOf(reg.active);
          if (activeVersion === expected) break;
          await delay(250);
        }
        if (activeVersion !== expected) throw new Error('아직 업데이트가 완료되지 않았습니다. 연결을 확인하고 다시 눌러주세요.');
        // 새 worker가 HTML을 처리하도록 제어권 취득까지 확인한다.
        if (await versionOf(navigator.serviceWorker.controller) !== expected)
          throw new Error('앱 제어권 전환 중입니다. 잠시 후 다시 눌러주세요.');
        status.textContent = `업데이트 완료 (${expected}). 캘린더를 엽니다…`;
        const target = new URL('./', base);
        target.searchParams.set('app-update', expected);
        target.hash = '/calendar?v=month';
        location.replace(target.href);
      } catch (error) {
        status.textContent = `${error.message}\n일정과 로그인 정보는 그대로 유지됩니다.`;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
